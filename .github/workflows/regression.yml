# regression.yml: the full regression (PROCESS-MECHANICS §11; principle P11).
#
# Under the process of 2026-09-25 the full regression runs ONLY at a release, or when Bob asks. It never
# runs on a push: a module job runs its module's and its layer's tests, and a push to `main` is a tranche's
# fast-forward of work already tested. This replaces the old process's `gates.yml`, which ran the whole
# battery on every push to `main` (retired 2026-09-26 by BOB #38 at Bob's direction).
#
# Started by hand from the Actions tab, or by BOB on Bob's request or at a release. What it runs grows with
# the extraction: each package's own tests today, each module's tests as modules are extracted.
name: regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
      - name: install
        run: |
          set -euo pipefail
          for pkg in bio-plane pdf-worker ocr-worker newgroup; do
            [ -f "$pkg/package-lock.json" ] || continue
            (cd "$pkg" && npm ci --no-audit --no-fund --loglevel=error)
          done
      - name: test every package
        run: |
          set -uo pipefail
          failed=""
          for pkg in bio-plane pdf-worker ocr-worker newgroup agent-worker; do
            [ -f "$pkg/package.json" ] || continue
            echo "::group::$pkg"
            if (cd "$pkg" && npm test); then echo "$pkg: passed"; else failed="$failed $pkg"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "regression: FAILED in$failed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "regression: every package passed" | tee -a "$GITHUB_STEP_SUMMARY"
