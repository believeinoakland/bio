# agent-runner-image.yml: builds agent-runner's container image and publishes it by digest (bio K1893, K1894).
#
# A release names agent-runner's image only by its digest (agent-runner R7, R13), and `deploy-fleet` pulls it from a
# registry. No session can build it (no Docker, the proxy's TLS), so GitHub's runners build it from the cut branch's
# Dockerfile and publish it publicly on GHCR. The release then writes the printed digest into `fleet-member.json` and
# `wrangler.jsonc` at the cut (runbook step 4). Runs on a push of a cut branch touching agent-runner, or by hand.
name: agent-runner-image

on:
  push:
    branches: ["dist/cut-*"]
    paths: ["agent-runner/Dockerfile", "agent-runner/package.json", "agent-runner/package-lock.json", "agent-runner/src/**", ".github/workflows/agent-runner-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        id: v
        run: echo "version=$(node -p "require('./agent-runner/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: agent-runner
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/believeinoakland/agent-runner:${{ steps.v.outputs.version }}
      - name: digest
        run: |
          echo "image: ghcr.io/believeinoakland/agent-runner@${{ steps.push.outputs.digest }}"
          echo "### agent-runner ${{ steps.v.outputs.version }}: \`ghcr.io/believeinoakland/agent-runner@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
